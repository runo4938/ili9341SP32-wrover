<!DOCTYPE HTML>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
               
      /*     new style        */
body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        .dark-table-wrapper {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin: 20px 0;
        }
        
        .dark-table {
            width: 100%;
            border-collapse: collapse;
            color: #e0e0e0;
        }
        
        .dark-table th {
            background: #2d2d2d;
            padding: 16px 20px;
            text-align: left;
            font-weight: 600;
            color: #bb86fc;
            border-bottom: 2px solid #333;
            font-size: 13px;
            letter-spacing: 1px;
        }
        
        .dark-table td {
            padding: 14px 20px;
            border-bottom: 1px solid #333;
            transition: all 0.3s ease;
        }
        
        .dark-table tr:hover td {
            background: #2a2a2a;
            color: #ffffff;
        }
        
        .dark-table .index-cell {
            color: #bb86fc;
            font-weight: bold;
            text-align: center;
            width: 50px;
        }
        
        .dark-table .name-cell {
            font-weight: 500;
            color: #e0e0e0;
        }
        
        .dark-table .url-cell .url-text {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #888;
            background: #2a2a2a;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        
        .dark-table tr:hover .url-cell .url-text {
            color: #fff;
            background: #333;
        }
      /*     end new style    */
    </style>
</head>
<body>    
    <div class="container">
        <div class="card text-center">
            <h2>ESP32-wroom-s3 Radio</h2>
            <p class="version-info">The current version of the program %version%</p>
            
            <div class="btn-group">
                <a class="btn" href="/setting">
                    <i class="fas fa-cog"></i> Settings
                </a>
                <a class="btn" href="/filesystem">
                    <i class="fas fa-upload"></i> Upload
                </a>
                <button class="btn" onclick="toggleCheckboxoff(this)">
                    <i class="fas fa-backward"></i> Prev
                </button>
                <button class="btn" onclick="toggleCheckboxmenu(this)">
                    <i class="fas fa-bars"></i> Menu
                </button>
                <button class="btn" onclick="toggleCheckbox(this)">
                    <i class="fas fa-forward"></i> Next
                </button>
            </div>
        </div>
        
        <div class="card">
            <h4>Radio Stations</h4>
            <div class="table-container">
                <!-- Здесь будет отображаться %nameST% от сервера -->
                %nameST%
            </div>
        </div>
    </div>

    <script>
        function toggleCheckbox(element) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/on", true);
            xhr.send();
        }

        function toggleCheckboxoff(element) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/off", true);
            xhr.send();
        }

        function toggleCheckboxmenu(element) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/menu", true);
            xhr.send();
        }
    </script>
</body>
</html>
