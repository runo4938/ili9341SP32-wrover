<!DOCTYPE HTML>
<html lang="en">
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">
        <div class="card text-center">
            <h2>ESP32 Radio</h2>
            <div class="btn-group">
                <a class="btn" href="/setting">
                    <i class="fas fa-cog"></i> Settings
                </a>
                <a class="btn" href="/filesystem">
                    <i class="fas fa-upload"></i> Upload
                </a>
                <button class="btn" onclick="toggleCheckboxoff(this)">
                    <i class="fas fa-backward"></i> Prev
                </button>
                <button class="btn" onclick="toggleCheckboxmenu(this)">
                    <i class="fas fa-bars"></i> Menu
                </button>
                <button class="btn" onclick="toggleCheckbox(this)">
                    <i class="fas fa-forward"></i> Next
                </button>
            </div>
        </div>
        <div class="card">
            <div class="volume-control text-center" style="padding: 5px; display: inline-block;">
                <label>Volume</label>
                <input type="range" id="volumeSlider" min="0" max="21" value="5" class="form-control-range"
                    style="width: 400px; margin: 0 auto; display: inline-block;">
                <div id="volumeValue" style="margin-top: 10px; font-size: 18px; display: inline-block;">
                    <span id="volPercent">10</span>
                </div </div>
            </div>
 </div>
            <div class="card">
                <div class="table-container scrolable">
                    %nameST%
                </div>
            </div>
       
        <script>
            function updateStationsTable() {
                fetch("/stations")
                    .then(response => response.text())
                    .then(html => {
                        document.querySelector('.table-container').innerHTML = html;
                    })
                    .catch(err => console.error("Ошибка обновления таблицы:", err));
            }
            function sendCommand(url) {
                fetch(url)
                    .then(() => {
                        updateStationsTable();
                    })
                    .catch(err => console.error("Ошибка команды:", err));
            }
            function toggleCheckbox(element) {
                sendCommand("/Prev");
            }
            function toggleCheckboxoff(element) {
                sendCommand("/Next");
            }
            function toggleCheckboxmenu(element) {
                sendCommand("/Menu");
            }

            // Загрузка текущей громкости при старте
            document.addEventListener('DOMContentLoaded', function () {
                fetch('/volume')
                    .then(response => response.json())
                    .then(data => {
                        const percent = data.percent || 10;
                        document.getElementById('volumeSlider').value = percent;
                        document.getElementById('volPercent').textContent = percent;
                    })
                    .catch(err => console.error("Не удалось загрузить громкость:", err));
            });

            // Отправка при изменении
            document.getElementById('volumeSlider').addEventListener('input', function () {
                const percent = this.value;
                fetch(`/set_volume?percent=${percent}`)
                    .then(() => {
                        document.getElementById('volPercent').textContent = percent;
                    })
                    .catch(err => console.error("Ошибка установки громкости:", err));
            });

            // Делегирование: клик по любой строке с data-station-id
            document.addEventListener('click', function (e) {
                const row = e.target.closest('.station-row');
                if (row) {
                    const stationId = row.getAttribute('data-station-id');
                    if (stationId !== null) {
                        sendStationCommand(stationId);
                    }
                }
            });

            function sendStationCommand(stationId) {
                fetch(`/play_station?station=${stationId}`)
                    .then(() => {
                        updateStationsTable(); // обновить таблицу, чтобы выделить новую текущую станцию
                    })
                    .catch(err => console.error("Ошибка переключения станции:", err));
            }
        </script>
</body>

</html>
