<!DOCTYPE HTML><html lang="en">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
 :root {--primary-color: #00acc1;--primary-dark: #00838f;--primary-light: #80deea;--secondary-color: #f5f5f5;--text-color: #333333;--border-radius: 8px;--shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
 }
 * {
     box-sizing: border-box;
 }
 body {font-family: 'Roboto', Arial, sans-serif;margin: 0;padding: 0;background-color: #f8f9fa;color: var(--text-color);line-height: 1.6;padding-top: 80px;}
 .header {position: fixed;top: 0;left: 0;width: 100%;background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));color: white;padding: 15px 0;box-shadow: var(--shadow);z-index: 1000;}
.header h3 {
     margin: 0;
     font-weight: 600;
     font-size: 1.5rem;
 }
 .container {
     max-width: 900px;
     padding: 0 15px;
     margin: 0 auto;
 }
 .card {
     background: white;
     border-radius: var(--border-radius);
     box-shadow: var(--shadow);
     padding: 25px;
     margin-bottom: 25px;
     border: none;
 }
 .btn {
     background-color: white;
     border: 2px solid var(--primary-color);
     color: var(--primary-color);
     border-radius: var(--border-radius);
     padding: 10px 20px;
     font-weight: 600;
     text-decoration: none;
     transition: all 0.3s ease;
     display: inline-flex;
     align-items: center;
     justify-content: center;
     margin: 5px;
     cursor: pointer;
     font-size: 14px;
 }
 .btn:hover {
     background-color: var(--primary-color);
     color: white;
     transform: translateY(-2px);
     box-shadow: 0 4px 8px rgba(0, 172, 193, 0.3);
 }
 .btn i {
     margin-right: 8px;
 }
 .btn-control {
     width: 100px;
     height: 40px;
     font-size: 16px;
 }
 .btn-group {
     display: flex;
     justify-content: center;
     flex-wrap: wrap;
     margin: 20px 0;
 }
 .version-info {
     font-size: 18px;
     color: #666;
     margin: 15px 0;
 }
 .table-container {
     overflow-x: auto;
     margin-top: 20px;
 }
 .styled-table {
     width: 100%;
     border-collapse: collapse;
     margin: 20px 0;
     font-size: 16px;
     border-radius: var(--border-radius);
     overflow: hidden;
     box-shadow: var(--shadow);
 }
 .styled-table thead tr {
     background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
     color: white;
     text-align: left;
     font-weight: bold;
 }
 .styled-table th,
 .styled-table td {
     padding: 15px 20px;
     text-align: left;
     border-bottom: 1px solid #dddddd;
 }
 .styled-table tbody tr {
     transition: background-color 0.2s;
 }
 .styled-table tbody tr:nth-of-type(even) {
     background-color: #f8f9fa;
 }
 .styled-table tbody tr:last-of-type {
     border-bottom: 2px solid var(--primary-color);
 }
 .styled-table tbody tr:hover {
     background-color: #e3f2fd;
 }
 .status-indicator {
     display: inline-block;
     width: 12px;
     height: 12px;
     border-radius: 50%;
     margin-right: 8px;
 }
 .status-online {
     background-color: #4caf50;
 }
 .status-offline {
     background-color: #f44336;
 }
@media (max-width: 768px) {body::after {content: "MOBILE MODE";position: fixed;top: 0;left: 0;background: red;color: white;padding: 5px;z-index: 9999;}
 .btn-group {flex-direction: column;align-items: center;}
 .btn {width: 100%;max-width: 250px;margin: 5px 0;}
.styled-table {font-size: 14px;}
.styled-table th,.styled-table td {padding: 10px 15px;}
}
.current-station {background-color: #e1f5fe !important;font-weight: bold;color: #0288d1;}
.styled-table tbody tr.current-station { background-color: #bbdefb !important;font-weight: bold;color: #0d47a1 !important;}
.styled-table tbody tr.current-station:hover {
background-color: #90caf9 !important;
}
  </style>
</head>
<body>
    <div class="container">
        <div class="card text-center">
            <h2>ESP32-wroom-s3 Radio</h2>
            <p class="version-info">The current version of the program %version%</p>
            <div class="btn-group">
                <a class="btn" href="/setting">
                    <i class="fas fa-cog"></i> Settings
                </a>
                <a class="btn" href="/filesystem">
                    <i class="fas fa-upload"></i> Upload
                </a>
                <button class="btn" onclick="toggleCheckboxoff(this)">
                    <i class="fas fa-backward"></i> Prev
                </button>
                <button class="btn" onclick="toggleCheckboxmenu(this)">
                    <i class="fas fa-bars"></i> Menu
                </button>
                <button class="btn" onclick="toggleCheckbox(this)">
                    <i class="fas fa-forward"></i> Next
                </button>
            </div>
        </div>
        <div class="card">
            <h4>Radio Stations</h4>
            <div class="table-container">
            %nameST%
            </div>
        </div>
    </div>
<script>
    function updateStationsTable() {
        fetch("/stations")
            .then(response => response.text())
            .then(html => {
                document.querySelector('.table-container').innerHTML = html;
            })
            .catch(err => console.error("Ошибка обновления таблицы:", err));
    }
    function sendCommand(url) {
        fetch(url)
            .then(() => {
                updateStationsTable();
            })
            .catch(err => console.error("Ошибка команды:", err));
    }
    function toggleCheckbox(element) {
        sendCommand("/on");
    }
    function toggleCheckboxoff(element) {
        sendCommand("/off");
    }
    function toggleCheckboxmenu(element) {
        sendCommand("/menu");
    }
</script>
</body>
</html>
