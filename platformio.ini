[env:upesy_wrover]
platform = espressif32
board = upesy_wrover
framework = arduino
monitor_speed = 115200
; Указываем размер Flash = 16MB
;board_build.flash_size = 16MB
; Включаем поддержку PSRAM
board_build.psram = true
board_build.psram_type = qspi
board_build.partitions = huge_app.csv
upload_speed = 921600
upload_port = COM4
upload_protocol = esptool
build_flags = 
	-DBOARD_HAS_PSRAM
	; -DBOARD_ILI9341_PLYWOOD
	-DBOARD_ILI9341_PLASTIC
;----------------------------
	-DBOARD_PCM5102
	; -DBOARD_VS1053
lib_deps = 
	gyverlibs/EncButton@^3.4
	esphome/ESPAsyncWebServer-esphome@^3.1.0
	gyverlibs/GyverNTP@^1.3.1
	bodmer/TFT_eSPI@^2.5.43
	esphome/ESP32-audioI2S@^2.0.7
	C:\Users\itsme\Documents\Arduino\libraries\WiFiManager\
	gyverlibs/Unixtime
	https://github.com/schreibfaul1/ESP32-vs1053_ext.git
	;https://github.com/schreibfaul1/ESP32-vs1053_ext.git
	;https://github.com/baldram/ESP_VS1053_Library
	;https://github.com/CelliesProjects/ESP32_VS1053_Stream.git
